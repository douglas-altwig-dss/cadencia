server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;  # .pptx templates

  # Sign-in and the API token, generated from Docker secrets by docker-entrypoint.d/40-cadencia-auth.sh.
  # Globs, so no secret configured means no file and an open app, as before.
  include /etc/nginx/cadencia/server-*.conf;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    # Who signed in, so comments and versions carry a name (empty when sign-in is off).
    proxy_set_header X-Remote-User $remote_user;
    include /etc/nginx/cadencia/api-*.conf;
    proxy_read_timeout 300s;  # deck generation with rendering
  }

  # #14: a read-only share link opens without signing in. The token in the path is the credential:
  # the API serves one deck's scene, pictures and fonts under /api/public/ and nothing else there.
  location /api/public/ {
    auth_basic off;
    limit_except GET { deny all; }
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  location /compartilhado/ {
    auth_basic off;
    try_files /index.html =404;
  }

  # The app's bundles are public code; the shared page needs them without a password too.
  location /assets/ {
    auth_basic off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;  # client-side routes
  }
}
